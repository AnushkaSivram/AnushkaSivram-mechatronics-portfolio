name: Deploy portfolio sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: seven-dof-arm/package-lock.json
      - name: Build 7-DOF React simulator
        working-directory: seven-dof-arm
        run: |
          npm ci
          npm run build
      - name: Assemble static portfolio
        run: |
          mkdir -p _site/seven-dof-arm
          cp index.html _site/index.html
          cp -R arm-path-planning balancing-leg custom-actuator motor-thermal-twin robotic-gripper robotic-wrist-fea rocket-deployment vehicle-suspension _site/
          cp -R seven-dof-arm/dist/. _site/seven-dof-arm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
