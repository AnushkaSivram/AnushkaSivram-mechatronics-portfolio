<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balancing Leg Control Lab</title><style>body{margin:0;background:#120f1d;color:#faf5ff;font:16px system-ui}main{max-width:820px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#f5a7ff}.tag{color:#c0adcb}.box{background:#271d37;border:1px solid #5a3f71;border-radius:16px;padding:22px;margin:26px 0}input{width:100%;accent-color:#f5a7ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.n{font-size:2rem;color:#f5a7ff;font-weight:700}svg{width:100%;height:270px;background:#170f24;border-radius:12px}</style><main><p class="tag">CLOSED-LOOP INVERTED PENDULUM</p><h1>Self-balancing robot leg</h1><p>A virtual torque-controlled hip counters moving-platform disturbances.</p><div class="box"><label>Platform displacement: <b id="x">100</b> mm</label><input id="s" type="range" min="10" max="180" value="100"><svg viewBox="0 0 500 270"><path d="M50 235H450" stroke="#f5a7ff" stroke-width="18"/><circle cx="250" cy="220" r="14" fill="#faf5ff"/><path id="leg" stroke="#f5a7ff" stroke-width="28" stroke-linecap="round"/></svg></div><div class="grid"><div class="box"><span class="tag">Peak angle error</span><div class="n" id="e"></div></div><div class="box"><span class="tag">Peak hip torque</span><div class="n" id="t"></div></div></div></main><script>let s=document.querySelector('#s');function u(){let q=+s.value;x.textContent=q;let a=q*.052;e.textContent=a.toFixed(1)+'°';t.textContent=Math.min(130,22+q*.72).toFixed(0)+' Nm';let rad=a*Math.PI/180;leg.setAttribute('d',`M250 220 L${250+150*Math.sin(rad)} ${220-150*Math.cos(rad)}`)}s.oninput=u;u()</script></html>
