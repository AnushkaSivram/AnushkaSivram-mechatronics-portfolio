<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycloidal Actuator Lab</title><style>body{margin:0;background:#101016;color:#f6f4ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#c7a6ff}.tag{color:#b8adc7}.box{background:#201c2a;border:1px solid #493a5c;border-radius:16px;padding:22px;margin:26px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.n{font-size:2rem;color:#c7a6ff;font-weight:700}input{width:100%;accent-color:#c7a6ff}svg{width:100%;height:170px}circle{fill:none;stroke:#c7a6ff;stroke-width:18}p{line-height:1.5}</style><main><p class="tag">BLDC + CYCLOIDAL REDUCTION · OPERATING MAP</p><h1>High-torque actuator</h1><p>Explore torque, speed, and reflected inertia before mechanical design.</p><div class="box"><label>Gear reduction: <b id="ratio">35</b>:1</label><input id="s" type="range" min="11" max="81" value="35"><label>Motor speed: <b id="rpm">3000</b> RPM</label><input id="v" type="range" min="500" max="6000" step="100" value="3000"><svg viewBox="0 0 500 170"><circle cx="250" cy="85" r="55"/><circle cx="250" cy="85" r="20"/><path id="ray" stroke="#f6f4ff" stroke-width="6"/></svg></div><div class="grid"><div class="box"><span class="tag">Continuous torque</span><div class="n" id="t"></div></div><div class="box"><span class="tag">Output speed</span><div class="n" id="out"></div></div><div class="box"><span class="tag">Reflected inertia</span><div class="n" id="i"></div></div></div></main><script>let s=document.querySelector('#s'),v=document.querySelector('#v');function u(){let r=+s.value,q=+v.value;ratio.textContent=r;rpm.textContent=q;t.textContent=(.42*r*.82).toFixed(1)+' Nm';out.textContent=(q/r).toFixed(0)+' RPM';i.textContent=(8e-5*r*r).toFixed(3)+' kg·m²';let a=q/6000*Math.PI*2;ray.setAttribute('d',`M250 85 L${250+45*Math.cos(a)} ${85+45*Math.sin(a)}`)}s.oninput=v.oninput=u;u()</script></html>
