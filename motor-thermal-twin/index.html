<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actuator Thermal Twin</title><style>body{margin:0;background:#1b1110;color:#fff7f2;font:16px system-ui}main{max-width:820px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#ff9f72}.tag{color:#d2aaa0}.box{background:#38201c;border:1px solid #6f4034;border-radius:16px;padding:22px;margin:26px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.n{font-size:2rem;color:#ff9f72;font-weight:700}input{width:100%;accent-color:#ff9f72}.therm{height:240px;width:70px;background:#4d2a22;border-radius:35px;margin:auto;overflow:hidden;display:flex;align-items:end}.fill{width:100%;background:#ff9f72;transition:.3s}</style><main><p class="tag">BLDC + CYCLOIDAL GEARBOX · ELECTRO-THERMAL MODEL</p><h1>Thermal digital twin</h1><p>Estimate winding temperature, current, and bus-voltage margin under a heavy load.</p><div class="box"><label>Output torque: <b id="x">16</b> Nm</label><input id="s" type="range" min="2" max="32" value="16"><div class="therm"><div class="fill" id="f"></div></div></div><div class="grid"><div class="box"><span class="tag">Motor current</span><div class="n" id="i"></div></div><div class="box"><span class="tag">Steady winding temperature</span><div class="n" id="temp"></div></div></div></main><script>let s=document.querySelector('#s');function u(){let q=+s.value;x.textContent=q;let cur=q/(35*.8*.085),heat=cur*cur*.18+q*3.2/35*(1-.8),T=25+heat*1.9;i.textContent=cur.toFixed(1)+' A';temp.textContent=T.toFixed(0)+' °C';f.style.height=Math.min(100,(T-25)/1.2)+'%'}s.oninput=u;u()</script></html>
