<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Gripper Simulator</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#74c7ff}.tag{color:#a6b7c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}.box{background:#10243a;border:1px solid #264764;border-radius:16px;padding:20px}label{display:block;margin:12px 0 6px}input{width:100%;accent-color:#74c7ff}.value{font-size:2rem;font-weight:700;color:#7fffd4}svg{width:100%;height:230px;background:#071b2d;border-radius:16px}footer{color:#a6b7c8;margin-top:24px}</style><main><p class="tag">MECHATRONICS LAB · CONCEPT SIMULATION</p><h1>Adaptive robotic gripper</h1><p>Force and finger-stress sizing for a two-jaw parallel gripper.</p><div class="box"><label>Jaw opening <b id="open">55</b> mm</label><input id="s" type="range" min="20" max="100" value="55"><svg viewBox="0 0 500 230"><circle cx="250" cy="115" r="48" fill="#ffbf69"/><path id="l" d="M70 30V200H190" fill="none" stroke="#74c7ff" stroke-width="22"/><path id="r" d="M430 30V200H310" fill="none" stroke="#74c7ff" stroke-width="22"/></svg></div><div class="grid"><div class="box"><span class="tag">Safe payload</span><div class="value" id="payload"></div></div><div class="box"><span class="tag">Finger stress</span><div class="value" id="stress"></div></div></div><footer>Model: friction-limited hold with 2× safety factor. Concept result only—validate a physical design.</footer></main><script>const s=document.querySelector('#s'),o=document.querySelector('#open'),p=document.querySelector('#payload'),st=document.querySelector('#stress');function u(){let x=+s.value,t=.5+.42*(1-(x-20)/80),n=1716.7*t/2;o.textContent=x;p.textContent=(2*n*.55/19.6133).toFixed(1)+' kg';st.textContent=(n*.07/1.6e-8/1e6).toFixed(0)+' MPa';document.querySelector('#l').setAttribute('d',`M70 30V200H${250-x*.85}`);document.querySelector('#r').setAttribute('d',`M430 30V200H${250+x*.85}`)}s.oninput=u;u()</script></html>
