<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robotic Wrist Stress Lab</title><style>body{margin:0;background:#11171b;color:#f1fbff;font:16px system-ui}main{max-width:820px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#70dbff}.tag{color:#a6bdc7}.box{background:#193039;border:1px solid #315765;border-radius:16px;padding:22px;margin:26px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.n{font-size:2rem;color:#70dbff;font-weight:700}input{width:100%;accent-color:#70dbff}svg{width:100%;height:230px;background:#0d242c;border-radius:12px}p{line-height:1.5}</style><main><p class="tag">WRIST-YOKE STRESS SCREENING · 50 LBF REFERENCE LOAD</p><h1>3-DOF robotic wrist</h1><p>Analytical stress screen for a wrist load path. Compare this conservative result against an FEA mesh before manufacturing.</p><div class="box"><label>Tip load: <b id="x">222</b> N</label><input id="s" type="range" min="20" max="500" value="222"><svg viewBox="0 0 500 230"><path d="M80 185H315V75H440" fill="none" stroke="#70dbff" stroke-width="34" stroke-linejoin="round"/><path id="force" stroke="#ffbf69" stroke-width="7" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ffbf69"/></marker></defs></svg></div><div class="grid"><div class="box"><span class="tag">Peak stress proxy</span><div class="n" id="stress"></div></div><div class="box"><span class="tag">Yield safety factor</span><div class="n" id="sf"></div></div></div></main><script>let s=document.querySelector('#s');function u(){let q=+s.value;x.textContent=q;let z=q*20.3/222;stress.textContent=z.toFixed(1)+' MPa';sf.textContent=(275/z).toFixed(2)+'×';force.setAttribute('d',`M440 ${75-Math.min(q/4,60)}V68`)}s.oninput=u;u()</script></html>
