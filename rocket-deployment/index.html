<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payload-Bay Deployment Lab</title><style>body{margin:0;background:#101722;color:#eef5ff;font:16px system-ui}main{max-width:820px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#ffbf69}.tag{color:#9db4d0}.box{background:#182940;border:1px solid #385778;border-radius:16px;padding:22px;margin:26px 0}input{width:100%;accent-color:#ffbf69}.n{font-size:2.3rem;font-weight:700;color:#ffbf69}svg{width:100%;height:230px;background:#0c1a2c;border-radius:14px}p{line-height:1.5}</style><main><p class="tag">LOW-ENERGY ENCLOSURE DYNAMICS · CONCEPT ONLY</p><h1>Payload-bay deployment</h1><p>Spring-and-hinge simulation for a reusable enclosure door. No propulsion or pyrotechnic systems are modeled.</p><div class="box"><label>Spring preload: <b id="x">0.75</b> Nm</label><input id="s" type="range" min="0.2" max="1.2" step=".01" value=".75"><svg viewBox="0 0 500 230"><rect x="110" y="50" width="280" height="150" rx="12" fill="#29415f"/><path id="door" d="M150 185L350 185" stroke="#ffbf69" stroke-width="22" stroke-linecap="round"/><circle cx="150" cy="185" r="12" fill="#eef5ff"/></svg></div><div class="box"><span class="tag">Estimated 90° opening time</span><div class="n" id="time"></div><span class="tag" id="status"></span></div></main><script>let s=document.querySelector('#s');function u(){let p=+s.value;x.textContent=p.toFixed(2);let ok=p>.59,t=ok?.35+.5*(.75/p):'—';time.textContent=typeof t==='number'?t.toFixed(2)+' s':t;status.textContent=ok?'Spring torque clears the modeled opposing load.':'Insufficient modeled opening torque.';let a=ok?-1.57:-.35;door.setAttribute('d',`M150 185 L${150+200*Math.cos(a)} ${185+200*Math.sin(a)}`)}s.oninput=u;u()</script></html>
