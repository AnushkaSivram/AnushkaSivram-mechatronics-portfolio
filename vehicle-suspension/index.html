<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quarter-Car Suspension Lab</title><style>body{margin:0;background:#0f1616;color:#ecfff9;font:16px system-ui}main{max-width:850px;margin:auto;padding:48px 22px}h1{font-size:clamp(2rem,6vw,4rem);margin:0;color:#7fffd4}.tag{color:#9ab9af}.box{background:#15302b;border:1px solid #286051;border-radius:16px;padding:22px;margin:26px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.n{font-size:2rem;font-weight:700;color:#7fffd4}input{width:100%;accent-color:#7fffd4}svg{width:100%;height:220px;background:#0b211d;border-radius:12px}p{line-height:1.5}</style><main><p class="tag">2-DOF QUARTER-CAR DYNAMICS</p><h1>Race suspension lab</h1><p>Change damping to inspect the comfort/road-holding tradeoff during a 50 mm bump.</p><div class="box"><label>Damper coefficient: <b id="d">2200</b> N·s/m</label><input id="s" type="range" min="600" max="5000" step="100" value="2200"><svg viewBox="0 0 500 220"><path d="M0 180H500" stroke="#7fffd4"/><path id="road" fill="none" stroke="#ffbf69" stroke-width="8"/><rect id="body" x="160" y="40" width="180" height="55" rx="8" fill="#7fffd4"/><path id="spring" stroke="#ecfff9" stroke-width="5" fill="none"/></svg></div><div class="grid"><div class="box"><span class="tag">Estimated peak body acceleration</span><div class="n" id="a"></div></div><div class="box"><span class="tag">Ride tuning</span><div class="n" id="m"></div></div></div></main><script>let s=document.querySelector('#s');function u(){let c=+s.value;d.textContent=c;a.textContent=(18*Math.sqrt(2200/c)).toFixed(1)+' m/s²';m.textContent=c<1600?'Underdamped':c>3400?'Overdamped':'Balanced';let y=95+(2200-c)/100;body.setAttribute('y',y);spring.setAttribute('d',`M250 ${y+55} l-20 10 40 10-40 10 40 10-20 10`);road.setAttribute('d','M0 180H190 Q225 125 260 180H500')}s.oninput=u;u()</script></html>
